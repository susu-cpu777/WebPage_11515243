<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldMini3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd"/>
      <stop offset="50%" stop-color="#dfb776"/>
      <stop offset="100%" stop-color="#8e682e"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffe28a" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#c79bff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#18112c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Handle Ring -->
  <circle cx="32" cy="11" r="5" fill="none" stroke="url(#goldMini3)" stroke-width="1.8"/>
  <!-- Cap -->
  <polygon points="20,20 44,20 38,15 26,15" fill="url(#goldMini3)"/>
  <!-- Glass Enclosure -->
  <rect x="21" y="20" width="22" height="30" rx="3" fill="#18112c" stroke="url(#goldMini3)" stroke-width="2"/>
  <!-- Candle / Flame Glow -->
  <ellipse cx="32" cy="35" rx="7" ry="10" fill="url(#lanternGlow)"/>
  <circle cx="32" cy="34" r="2" fill="#fff"/>
  <!-- Base -->
  <rect x="18" y="50" width="28" height="5" rx="2" fill="url(#goldMini3)"/>
  <!-- Rays / Sparkles -->
  <line x1="8" y1="35" x2="14" y2="35" stroke="#dfb776" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="50" y1="35" x2="56" y2="35" stroke="#dfb776" stroke-width="1.2" stroke-linecap="round"/>
  <text x="44" y="22" fill="#dfb776" font-size="9">✦</text>
  <text x="12" y="52" fill="#c79bff" font-size="9">✧</text>
</svg>
