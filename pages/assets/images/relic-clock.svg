<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldMini1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd"/>
      <stop offset="50%" stop-color="#dfb776"/>
      <stop offset="100%" stop-color="#8e682e"/>
    </linearGradient>
  </defs>
  <!-- Crown / Ring -->
  <circle cx="32" cy="10" r="6" fill="none" stroke="url(#goldMini1)" stroke-width="2"/>
  <rect x="29" y="14" width="6" height="4" rx="1" fill="url(#goldMini1)"/>
  <!-- Pocket Watch Case -->
  <circle cx="32" cy="38" r="22" fill="#18112c" stroke="url(#goldMini1)" stroke-width="2.5"/>
  <circle cx="32" cy="38" r="18" fill="none" stroke="#c79bff" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.6"/>
  <!-- Hands -->
  <circle cx="32" cy="38" r="2.5" fill="url(#goldMini1)"/>
  <line x1="32" y1="38" x2="25" y2="30" stroke="url(#goldMini1)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="38" x2="40" y2="38" stroke="#fdf0cd" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Hour Markers -->
  <circle cx="32" cy="22" r="1.2" fill="#dfb776"/>
  <circle cx="48" cy="38" r="1.2" fill="#dfb776"/>
  <circle cx="32" cy="54" r="1.2" fill="#dfb776"/>
  <circle cx="16" cy="38" r="1.2" fill="#dfb776"/>
  <!-- Sparkles -->
  <text x="44" y="22" fill="#c79bff" font-size="10">✦</text>
</svg>
