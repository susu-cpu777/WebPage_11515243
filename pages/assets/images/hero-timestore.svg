<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#362263" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#1e143f" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#0d091e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd"/>
      <stop offset="35%" stop-color="#dfb776"/>
      <stop offset="70%" stop-color="#c89d58"/>
      <stop offset="100%" stop-color="#8e682e"/>
    </linearGradient>
    <linearGradient id="dialGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1437"/>
      <stop offset="100%" stop-color="#0f0a20"/>
    </linearGradient>
    <radialGradient id="magicAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c79bff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#e2c875" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e143f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="560" height="420" rx="16" fill="url(#skyGlow)"/>

  <!-- Starry Constellations & Ambient Dust -->
  <g opacity="0.65">
    <circle cx="65" cy="55" r="1.5" fill="#fff"/>
    <circle cx="120" cy="85" r="1.2" fill="#dfb776"/>
    <circle cx="190" cy="40" r="1.8" fill="#fff"/>
    <circle cx="280" cy="70" r="1" fill="#c79bff"/>
    <circle cx="360" cy="45" r="1.5" fill="#fff"/>
    <circle cx="480" cy="65" r="1.8" fill="#dfb776"/>
    <circle cx="510" cy="130" r="1.2" fill="#fff"/>
    <circle cx="45" cy="180" r="1" fill="#c79bff"/>
    <circle cx="95" cy="240" r="1.6" fill="#fff"/>
    <circle cx="500" cy="270" r="1.5" fill="#dfb776"/>
    <circle cx="440" cy="330" r="1.2" fill="#fff"/>
    <circle cx="70" cy="350" r="1.4" fill="#dfb776"/>
  </g>

  <!-- Ambient Light Halo -->
  <circle cx="250" cy="210" r="180" fill="url(#magicAura)"/>

  <!-- Antique Hourglass (Right) -->
  <g transform="translate(370, 140)">
    <!-- Aura -->
    <ellipse cx="60" cy="110" rx="55" ry="85" fill="#c79bff" opacity="0.15" filter="url(#glowEffect)"/>
    <!-- Top & Bottom Plates -->
    <rect x="15" y="10" width="90" height="10" rx="4" fill="url(#goldGrad)" stroke="#5c431d" stroke-width="1.5"/>
    <rect x="25" y="6" width="70" height="4" rx="2" fill="url(#goldGrad)"/>
    <rect x="15" y="200" width="90" height="10" rx="4" fill="url(#goldGrad)" stroke="#5c431d" stroke-width="1.5"/>
    <rect x="25" y="210" width="70" height="4" rx="2" fill="url(#goldGrad)"/>
    <!-- Pillars -->
    <line x1="24" y1="20" x2="24" y2="200" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="96" y1="20" x2="96" y2="200" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="20" x2="60" y2="200" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3,6" opacity="0.6"/>
    <!-- Glass Bulb Upper & Lower -->
    <path d="M 30,22 C 30,75 54,95 58,110 C 54,125 30,145 30,198 L 90,198 C 90,145 66,125 62,110 C 66,95 90,75 90,22 Z"
          fill="rgba(199, 155, 255, 0.12)" stroke="rgba(223, 183, 118, 0.6)" stroke-width="2"/>
    <!-- Starlight Sand in lower bulb -->
    <path d="M 36,196 C 36,170 54,160 60,158 C 66,160 84,170 84,196 Z" fill="url(#goldGrad)" opacity="0.85"/>
    <!-- Flowing sand thread -->
    <line x1="60" y1="95" x2="60" y2="160" stroke="#fdf0cd" stroke-width="2" stroke-dasharray="2,3"/>
    <!-- Upper Sand -->
    <path d="M 38,40 C 44,70 55,80 60,82 C 65,80 76,70 82,40 Z" fill="url(#goldGrad)" opacity="0.6"/>
    <!-- Glowing Sand Sparkles -->
    <circle cx="60" cy="110" r="3" fill="#fff" filter="url(#glowEffect)"/>
    <circle cx="56" cy="175" r="2" fill="#fff"/>
    <circle cx="65" cy="185" r="1.5" fill="#fdf0cd"/>
  </g>

  <!-- Large Antique Pocket Watch (Center-Left) -->
  <g transform="translate(110, 65)">
    <!-- Outer Ring / Pendant Loop -->
    <circle cx="150" cy="165" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="12" filter="url(#glowEffect)"/>
    <circle cx="150" cy="165" r="130" fill="none" stroke="#68471b" stroke-width="2"/>
    <circle cx="150" cy="20" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="6"/>
    <rect x="142" y="32" width="16" height="12" rx="3" fill="url(#goldGrad)"/>

    <!-- Clock Outer Dial with Double Golden Filigree Border -->
    <circle cx="150" cy="165" r="118" fill="url(#dialGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="150" cy="165" r="110" fill="none" stroke="#dfb776" stroke-width="1" stroke-dasharray="2,4" opacity="0.7"/>

    <!-- Astronomical Ring inside dial -->
    <circle cx="150" cy="165" r="82" fill="none" stroke="#c79bff" stroke-width="1.2" opacity="0.45"/>
    <circle cx="150" cy="165" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="4,8" opacity="0.6"/>

    <!-- Roman Numerals (Stylized Markers) -->
    <!-- XII -->
    <text x="150" y="78" fill="#fdf0cd" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="16" font-weight="bold" text-anchor="middle">XII</text>
    <!-- III -->
    <text x="240" y="171" fill="#fdf0cd" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="15" font-weight="bold" text-anchor="middle">III</text>
    <!-- VI -->
    <text x="150" y="260" fill="#fdf0cd" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="15" font-weight="bold" text-anchor="middle">VI</text>
    <!-- IX -->
    <text x="60" y="171" fill="#fdf0cd" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="15" font-weight="bold" text-anchor="middle">IX</text>

    <!-- Star Markers on Clock -->
    <text x="195" y="90" fill="#c79bff" font-size="11" text-anchor="middle">✦</text>
    <text x="225" y="125" fill="#c79bff" font-size="11" text-anchor="middle">✦</text>
    <text x="225" y="215" fill="#c79bff" font-size="11" text-anchor="middle">✦</text>
    <text x="195" y="245" fill="#c79bff" font-size="11" text-anchor="middle">✦</text>
    <text x="105" y="245" fill="#c79bff" font-size="11" text-anchor="middle">✦</text>
    <text x="75" y="215" fill="#c79bff" font-size="11" text-anchor="middle">✦</text>
    <text x="75" y="125" fill="#c79bff" font-size="11" text-anchor="middle">✦</text>
    <text x="105" y="90" fill="#c79bff" font-size="11" text-anchor="middle">✦</text>

    <!-- Reverse Time Counter-Clockwise Spiral Arrow -->
    <path d="M 120,135 A 40,40 0 1,0 150,125" fill="none" stroke="#c79bff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <polygon points="116,131 126,134 122,143" fill="#c79bff"/>

    <!-- Clock Hands (Counter-Clockwise Motif) -->
    <!-- Hour Hand -->
    <line x1="150" y1="165" x2="110" y2="135" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="110" cy="135" r="5" fill="url(#goldGrad)"/>
    <!-- Minute Hand -->
    <line x1="150" y1="165" x2="175" y2="92" stroke="#fdf0cd" stroke-width="3" stroke-linecap="round"/>
    <polygon points="175,85 171,98 179,98" fill="#fdf0cd"/>
    <!-- Center Jewel Pin -->
    <circle cx="150" cy="165" r="8" fill="url(#goldGrad)"/>
    <circle cx="150" cy="165" r="4" fill="#362263"/>
    <circle cx="150" cy="165" r="2" fill="#fff"/>
  </g>

  <!-- Mystical Memory Bottle (Bottom Left) -->
  <g transform="translate(60, 270)">
    <!-- Bottle Body -->
    <path d="M 35,45 C 35,25 45,20 45,10 L 55,10 C 55,20 65,25 65,45 C 65,75 58,85 50,85 C 42,85 35,75 35,45 Z"
          fill="rgba(199, 155, 255, 0.22)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Cork -->
    <rect x="44" y="2" width="12" height="8" rx="2" fill="#a47844"/>
    <!-- Glowing Memory Liquid inside -->
    <ellipse cx="50" cy="62" rx="11" ry="17" fill="#dfb776" opacity="0.6" filter="url(#glowEffect)"/>
    <circle cx="50" cy="60" r="3" fill="#fff"/>
  </g>

  <!-- Golden Floating Stars & Shimmer -->
  <g fill="#dfb776" opacity="0.8">
    <text x="95" y="120" font-size="16">✦</text>
    <text x="495" y="195" font-size="18">✧</text>
    <text x="340" y="340" font-size="22">✦</text>
    <text x="210" y="380" font-size="14">✧</text>
    <text x="415" y="90" font-size="14">✦</text>
  </g>

  <!-- Title Badge Label Overlay -->
  <rect x="28" y="365" width="230" height="34" rx="8" fill="rgba(15, 10, 32, 0.85)" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <text x="42" y="387" fill="#dfb776" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="12" letter-spacing="2">TIMEPIECE &amp; MEMORY</text>
  <text x="238" y="387" fill="#c79bff" font-size="12">✦</text>
</svg>
