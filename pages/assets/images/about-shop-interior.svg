<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="100%" height="100%">
  <defs>
    <radialGradient id="roomAtmosphere" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2d1c52" stop-opacity="1"/>
      <stop offset="60%" stop-color="#18102d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0b0716" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a3d24"/>
      <stop offset="50%" stop-color="#3d2715"/>
      <stop offset="100%" stop-color="#28170b"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc7"/>
      <stop offset="40%" stop-color="#dfb776"/>
      <stop offset="80%" stop-color="#a67b36"/>
      <stop offset="100%" stop-color="#694b1a"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe699" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#e8a838" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#a458b0" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#18102d" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Room Background -->
  <rect width="560" height="380" rx="16" fill="url(#roomAtmosphere)"/>

  <!-- Antique Window with Moonlight & Stars (Left) -->
  <g transform="translate(35, 30)">
    <rect x="0" y="0" width="90" height="150" rx="45" fill="#1b1236" stroke="url(#brassGrad)" stroke-width="2.5"/>
    <line x1="45" y1="0" x2="45" y2="150" stroke="url(#brassGrad)" stroke-width="1.5"/>
    <line x1="0" y1="75" x2="90" y2="75" stroke="url(#brassGrad)" stroke-width="1.5"/>
    <!-- Crescent Moon & Stars in Window -->
    <path d="M 50,30 A 18,18 0 0,0 65,45 A 22,22 0 1,1 50,30 Z" fill="#ffe9a0" opacity="0.85"/>
    <circle cx="28" cy="40" r="1.5" fill="#fff"/>
    <circle cx="70" cy="90" r="1.2" fill="#c79bff"/>
    <circle cx="30" cy="115" r="1.5" fill="#dfb776"/>
  </g>

  <!-- Antique Grandfather Clock on Wall (Center-Left) -->
  <g transform="translate(155, 30)">
    <!-- Body Frame -->
    <rect x="15" y="0" width="70" height="230" rx="6" fill="url(#woodGrad)" stroke="url(#brassGrad)" stroke-width="1.5"/>
    <polygon points="10,-6 50,-24 90,-6 85,0 15,0" fill="url(#brassGrad)"/>
    <!-- Dial -->
    <circle cx="50" cy="45" r="26" fill="#fdfaf3" stroke="url(#brassGrad)" stroke-width="3"/>
    <circle cx="50" cy="45" r="22" fill="none" stroke="#694b1a" stroke-width="0.8"/>
    <circle cx="50" cy="45" r="3" fill="#694b1a"/>
    <line x1="50" y1="45" x2="50" y2="30" stroke="#4a300d" stroke-width="2"/>
    <line x1="50" y1="45" x2="62" y2="45" stroke="#4a300d" stroke-width="1.5"/>
    <!-- Pendulum Chamber Glass Door -->
    <rect x="25" y="85" width="50" height="130" rx="3" fill="rgba(199, 155, 255, 0.08)" stroke="url(#brassGrad)" stroke-width="1"/>
    <!-- Pendulum Rod & Bob -->
    <line x1="50" y1="85" x2="50" y2="175" stroke="url(#brassGrad)" stroke-width="2.5"/>
    <circle cx="50" cy="180" r="14" fill="url(#brassGrad)" filter="url(#softGlow)"/>
  </g>

  <!-- Antique Curiosity Shelf with Glass Domes & Memory Bottles (Right) -->
  <g transform="translate(260, 20)">
    <!-- Wooden Shelf Cabinet Backing -->
    <rect x="0" y="0" width="265" height="270" rx="8" fill="#1e1335" stroke="url(#brassGrad)" stroke-width="2"/>
    <!-- Shelves Tiers -->
    <line x1="0" y1="90" x2="265" y2="90" stroke="url(#brassGrad)" stroke-width="3"/>
    <line x1="0" y1="180" x2="265" y2="180" stroke="url(#brassGrad)" stroke-width="3"/>

    <!-- Tier 1: Glass Bell Jars & Crystal Relics -->
    <!-- Bell Jar 1 (Violet Memory Sphere) -->
    <g transform="translate(25, 15)">
      <rect x="5" y="65" width="40" height="6" rx="2" fill="url(#woodGrad)"/>
      <path d="M 10,65 L 10,25 C 10,8 40,8 40,25 L 40,65 Z" fill="rgba(255, 255, 255, 0.12)" stroke="url(#brassGrad)" stroke-width="1.2"/>
      <circle cx="25" cy="40" r="11" fill="#c79bff" opacity="0.8" filter="url(#softGlow)"/>
      <circle cx="25" cy="40" r="3" fill="#fff"/>
    </g>
    <!-- Bell Jar 2 (Golden Starlight Sphere) -->
    <g transform="translate(90, 15)">
      <rect x="5" y="65" width="40" height="6" rx="2" fill="url(#woodGrad)"/>
      <path d="M 10,65 L 10,25 C 10,8 40,8 40,25 L 40,65 Z" fill="rgba(255, 255, 255, 0.12)" stroke="url(#brassGrad)" stroke-width="1.2"/>
      <circle cx="25" cy="40" r="12" fill="#dfb776" opacity="0.85" filter="url(#softGlow)"/>
      <circle cx="23" cy="38" r="3" fill="#fff"/>
    </g>
    <!-- Celestial Astrolabe (Right on Shelf 1) -->
    <g transform="translate(170, 20)">
      <circle cx="35" cy="35" r="26" fill="none" stroke="url(#brassGrad)" stroke-width="2"/>
      <circle cx="35" cy="35" r="18" fill="none" stroke="#c79bff" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="15" y1="35" x2="55" y2="35" stroke="url(#brassGrad)" stroke-width="1.5"/>
      <line x1="35" y1="15" x2="35" y2="55" stroke="url(#brassGrad)" stroke-width="1.5"/>
      <polygon points="35,10 40,35 35,60 30,35" fill="url(#brassGrad)" opacity="0.6"/>
    </g>

    <!-- Tier 2: Ancient Grimoires & Time Sand Jars -->
    <!-- Vintage Books Stack -->
    <g transform="translate(20, 110)">
      <rect x="0" y="48" width="55" height="18" rx="2" fill="#693b2a" stroke="#dfb776" stroke-width="1"/>
      <rect x="4" y="28" width="50" height="18" rx="2" fill="#2d4a3e" stroke="#dfb776" stroke-width="1"/>
      <rect x="8" y="10" width="44" height="16" rx="2" fill="#4a2d69" stroke="#dfb776" stroke-width="1"/>
    </g>
    <!-- Cyan Memory Flask -->
    <g transform="translate(100, 105)">
      <path d="M 18,20 L 26,20 L 26,35 L 38,62 C 39,66 35,68 30,68 L 14,68 C 9,68 5,66 6,62 L 18,35 Z"
            fill="rgba(125, 215, 255, 0.25)" stroke="url(#brassGrad)" stroke-width="1.5"/>
      <ellipse cx="22" cy="55" rx="11" ry="8" fill="#75d6ff" opacity="0.75" filter="url(#softGlow)"/>
      <circle cx="22" cy="54" r="3" fill="#fff"/>
    </g>
    <!-- Time Hourglass Mini -->
    <g transform="translate(180, 108)">
      <rect x="10" y="0" width="40" height="5" rx="2" fill="url(#brassGrad)"/>
      <rect x="10" y="60" width="40" height="5" rx="2" fill="url(#brassGrad)"/>
      <path d="M 15,5 C 15,30 27,32 30,32 C 33,32 45,30 45,5 L 45,60 C 45,35 33,32 30,32 C 27,32 15,35 15,60 Z"
            fill="rgba(255, 255, 255, 0.1)" stroke="url(#brassGrad)" stroke-width="1.2"/>
      <circle cx="30" cy="50" r="6" fill="#dfb776" opacity="0.8"/>
    </g>

    <!-- Tier 3: Antique Key Box & Scroll Bundles -->
    <g transform="translate(25, 200)">
      <rect x="0" y="25" width="60" height="35" rx="3" fill="url(#woodGrad)" stroke="url(#brassGrad)" stroke-width="1.5"/>
      <circle cx="30" cy="42" r="4" fill="url(#brassGrad)"/>
      <line x1="30" y1="46" x2="30" y2="52" stroke="url(#brassGrad)" stroke-width="1.5"/>
    </g>
    <!-- Scrolls with ribbons -->
    <g transform="translate(105, 205)">
      <rect x="0" y="32" width="55" height="12" rx="6" fill="#f4eedb" stroke="#7a5b28" stroke-width="1"/>
      <rect x="22" y="30" width="8" height="16" fill="#a44b4b"/>
      <rect x="10" y="16" width="50" height="12" rx="6" fill="#eae3cb" stroke="#7a5b28" stroke-width="1"/>
      <rect x="30" y="14" width="8" height="16" fill="#4a5ba4"/>
    </g>
    <!-- Brass Scales of Trade -->
    <g transform="translate(185, 195)">
      <line x1="30" y1="10" x2="30" y2="65" stroke="url(#brassGrad)" stroke-width="2.5"/>
      <rect x="18" y="65" width="24" height="6" rx="2" fill="url(#brassGrad)"/>
      <line x1="12" y1="18" x2="48" y2="18" stroke="url(#brassGrad)" stroke-width="2"/>
      <!-- Pan 1 & Pan 2 -->
      <path d="M 6,36 C 6,44 18,44 18,36 Z" fill="url(#brassGrad)"/>
      <line x1="12" y1="18" x2="6" y2="36" stroke="url(#brassGrad)" stroke-width="0.8"/>
      <line x1="12" y1="18" x2="18" y2="36" stroke="url(#brassGrad)" stroke-width="0.8"/>
      <path d="M 42,36 C 42,44 54,44 54,36 Z" fill="url(#brassGrad)"/>
      <line x1="48" y1="18" x2="42" y2="36" stroke="url(#brassGrad)" stroke-width="0.8"/>
      <line x1="48" y1="18" x2="54" y2="36" stroke="url(#brassGrad)" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Antique Velvet Countertop Foreground (Bottom) -->
  <rect x="0" y="295" width="560" height="85" fill="#1b1028" stroke="url(#brassGrad)" stroke-width="1.5"/>
  <rect x="0" y="295" width="560" height="12" fill="url(#woodGrad)"/>
  <line x1="0" y1="307" x2="560" y2="307" stroke="url(#brassGrad)" stroke-width="1"/>

  <!-- Vintage Brass Lantern on Counter (Left Forefront) -->
  <g transform="translate(70, 225)">
    <!-- Light Glow Overlay -->
    <circle cx="35" cy="50" r="70" fill="url(#lampGlow)" pointer-events="none"/>
    <!-- Lantern Structure -->
    <polygon points="20,20 50,20 42,8 28,8" fill="url(#brassGrad)"/>
    <circle cx="35" cy="5" r="6" fill="none" stroke="url(#brassGrad)" stroke-width="2"/>
    <rect x="18" y="20" width="34" height="50" rx="3" fill="rgba(255, 230, 150, 0.4)" stroke="url(#brassGrad)" stroke-width="2"/>
    <circle cx="35" cy="45" r="9" fill="#fff" filter="url(#softGlow)"/>
    <rect x="15" y="70" width="40" height="8" rx="2" fill="url(#brassGrad)"/>
  </g>

  <!-- Old Grimoire Open on Counter -->
  <g transform="translate(220, 310)">
    <path d="M 20,40 C 45,35 70,36 90,44 C 110,36 135,35 160,40 L 155,56 C 132,51 110,52 90,58 C 70,52 48,51 25,56 Z"
          fill="#fbf7ec" stroke="#5a3d24" stroke-width="1.5"/>
    <line x1="90" y1="44" x2="90" y2="58" stroke="#5a3d24" stroke-width="2"/>
    <!-- Text Lines -->
    <line x1="38" y1="42" x2="78" y2="42" stroke="#b09e7c" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="38" y1="47" x2="78" y2="47" stroke="#b09e7c" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="102" y1="42" x2="142" y2="42" stroke="#b09e7c" stroke-width="1.5" stroke-dasharray="3,2"/>
    <line x1="102" y1="47" x2="142" y2="47" stroke="#b09e7c" stroke-width="1.5" stroke-dasharray="3,2"/>
  </g>

  <!-- Floating Star Sparks in Interior -->
  <g fill="#ffe699" opacity="0.85">
    <text x="145" y="160" font-size="12">✦</text>
    <text x="235" y="90" font-size="14">✧</text>
    <text x="515" y="240" font-size="16">✦</text>
    <text x="180" y="280" font-size="10">✧</text>
  </g>

  <!-- Label Badge (Bottom Right) -->
  <rect x="365" y="335" width="175" height="28" rx="6" fill="rgba(11, 7, 22, 0.88)" stroke="url(#brassGrad)" stroke-width="1"/>
  <text x="380" y="353" fill="#dfb776" font-family="'Cinzel', 'Noto Serif TC', serif" font-size="11" letter-spacing="1.5">STORE SANCTUARY</text>
  <text x="525" y="353" fill="#c79bff" font-size="11">✦</text>
</svg>
